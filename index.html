<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandit SARIF Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
        }
        .stat-label { font-size: 12px; color: #8b949e; }
        .stat-value { font-size: 24px; font-weight: bold; margin-top: 5px; }
        .high { color: #f85149; }
        .medium { color: #d29922; }
        .low { color: #58a6ff; }

        .issue {
            background: #161b22;
            border-left: 4px solid;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .issue.severity-high { border-color: #f85149; }
        .issue.severity-medium { border-color: #d29922; }
        .issue.severity-low { border-color: #58a6ff; }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        .issue-title { font-size: 16px; font-weight: 600; }
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.high { background: #f851491a; color: #f85149; }
        .badge.medium { background: #d299221a; color: #d29922; }
        .badge.low { background: #58a6ff1a; color: #58a6ff; }

        .issue-location {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .issue-message {
            color: #c9d1d9;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .issue-link {
            color: #58a6ff;
            text-decoration: none;
            font-size: 13px;
        }
        .issue-link:hover { text-decoration: underline; }

        .filter-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .filter-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }
        .filter-btn.active { background: #58a6ff; color: #0d1117; }
        .filter-btn:hover { background: #30363d; }

        #dropzone {
            border: 2px dashed #30363d;
            border-radius: 6px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }
        #dropzone:hover { border-color: #58a6ff; }
        #dropzone.dragover { border-color: #58a6ff; background: #161b22; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Bandit Security Scan Results</h1>

        <div id="dropzone">
            <p>📁 Ziehe bandit-results.sarif hierher oder klicke zum Hochladen</p>
            <input type="file" id="fileInput" accept=".sarif,.json" style="display: none;">
        </div>

        <div class="stats" id="stats"></div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">Alle</button>
            <button class="filter-btn" data-filter="high">High</button>
            <button class="filter-btn" data-filter="medium">Medium</button>
            <button class="filter-btn" data-filter="low">Low</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        let currentData = null;
        let currentFilter = 'all';

        // Drag & Drop
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) loadFile(file);
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadFile(file);
        });

        // Filter
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                if (currentData) renderResults(currentData);
            });
        });

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    currentData = JSON.parse(e.target.result);
                    dropzone.style.display = 'none';
                    renderResults(currentData);
                } catch (err) {
                    alert('Fehler beim Laden der SARIF-Datei: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function renderResults(data) {
            const run = data.runs[0];
            const results = run.results || [];

            // Stats
            const stats = { high: 0, medium: 0, low: 0 };
            results.forEach(r => {
                const level = r.level || 'warning';
                if (level === 'error') stats.high++;
                else if (level === 'warning') stats.medium++;
                else stats.low++;
            });

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Issues</div>
                    <div class="stat-value">${results.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">High Severity</div>
                    <div class="stat-value high">${stats.high}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Medium Severity</div>
                    <div class="stat-value medium">${stats.medium}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Low Severity</div>
                    <div class="stat-value low">${stats.low}</div>
                </div>
            `;

            // Results
            const filtered = results.filter(r => {
                if (currentFilter === 'all') return true;
                const level = r.level || 'warning';
                if (currentFilter === 'high' && level === 'error') return true;
                if (currentFilter === 'medium' && level === 'warning') return true;
                if (currentFilter === 'low' && level === 'note') return true;
                return false;
            });

            document.getElementById('results').innerHTML = filtered.map(result => {
                const level = result.level || 'warning';
                const severity = level === 'error' ? 'high' : level === 'warning' ? 'medium' : 'low';
                const location = result.locations[0].physicalLocation;
                const uri = location.artifactLocation.uri;
                const line = location.region.startLine;
                const rule = run.tool.driver.rules.find(r => r.id === result.ruleId);

                return `
                    <div class="issue severity-${severity}">
                        <div class="issue-header">
                            <div class="issue-title">${result.ruleId}: ${rule?.name || 'Unknown'}</div>
                            <span class="badge ${severity}">${severity}</span>
                        </div>
                        <div class="issue-location">📍 ${uri}:${line}</div>
                        <div class="issue-message">${result.message.text}</div>
                        ${rule?.helpUri ? `<a href="${rule.helpUri}" target="_blank" class="issue-link">📚 Mehr Infos →</a>` : ''}
                    </div>
                `;
            }).join('');
        }

        // Auto-load wenn bandit-results.sarif im gleichen Ordner liegt
        fetch('bandit-results.sarif')
            .then(r => r.json())
            .then(data => {
                currentData = data;
                dropzone.style.display = 'none';
                renderResults(data);
            })
            .catch(() => {
                // Datei nicht gefunden - Benutzer muss sie hochladen
            });
    </script>
</body>
</html>
